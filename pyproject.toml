# ── QuantFlow project + tooling configuration ────────────────────────────────
#
# Dependency policy (carried over from requirements.txt):
#   `>=` floors are set at the versions verified working in venv-311 (Python
#   3.11.9). Floors stop silent downward drift — a `pip install` of one package
#   once resolved pandas back to 1.5.3, which segfaulted LightGBM's C
#   extension. A few packages are hard-pinned where the exact version is
#   load-bearing rather than merely a minimum.

[project]
name            = "quantflow"
version         = "0.1.0"
description     = "Quantitative stock analytics: ingestion, indicators, anomaly detection, multi-model forecasting, and news sentiment."
readme          = "README.md"
license         = { file = "LICENSE" }
authors         = [{ name = "Shubh Dave" }]

# Upper bound is not stylistic: numpy is hard-pinned to 1.26.4, which publishes
# no wheels for 3.13. Raising the ceiling means unpinning numpy first.
requires-python = ">=3.11,<3.13"

dependencies = [
    # Ingestion
    "yfinance>=1.5.2",
    "requests>=2.32.4",        # 2.31.0 carries CVE-2024-35195 / CVE-2024-47081
    "feedparser>=6.0.14",
    # Database
    "psycopg2-binary>=2.9.12",
    "SQLAlchemy==2.0.30",
    # Data processing
    # pandas and numpy are hard-pinned: LightGBM and XGBoost link against
    # numpy's ABI, and a pandas downgrade has already been observed to crash
    # LightGBM.
    "pandas==2.2.2",
    "numpy==1.26.4",
    "ta>=0.11.0",
    # Scheduling
    "APScheduler==3.10.4",
    # Environment
    "python-dotenv>=1.2.2",    # 1.0.1 carries PYSEC-2026-2270
    # Forecasting
    "prophet>=1.3.0",
    "statsmodels>=0.14.6",
    "scipy>=1.17.1",           # direct import: ensemble.py uses scipy.optimize.nnls
    "xgboost>=3.2.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.15.1",
    # Sentiment
    "transformers>=5.14.1",
    "torch>=2.13.0",           # not imported directly; transformers needs it for FinBERT
    "newsapi-python>=0.2.7",
    # Dashboard
    "streamlit>=1.61.0",       # the dashboard uses st.divider(), added in 1.23
    "plotly>=6.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/logn1602/QuantFlow"
Demo     = "https://quantflow-analytics.streamlit.app"

[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src/ layout. Installing the package (editable, via uv sync) is what lets every
# module do `from quantflow.config import TICKERS` instead of mutating sys.path
# at import time, which is what the previous flat layout required in 15 files.
[tool.setuptools.packages.find]
where = ["src"]


# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length    = 88
extend-exclude = ["venv-311", ".venv", "mlruns", "mlruns_artifacts", "logs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    # Ruff's own guidance when the formatter is enabled: the formatter owns
    # line width, and E501 only fires on things it cannot split — embedded SQL
    # and the box-drawing section dividers used throughout this codebase.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers (_fit_nnls, _mape) on purpose — that is
# where the look-ahead guarantees are asserted.
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["quantflow"]


# ── mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version         = "3.11"

# Explicit source roots rather than `mypy .`. Walking the whole tree pulls the
# virtualenvs in as *source*, and mypy then prefers those files over the
# installed distributions — which made it report "cannot find implementation or
# library stub" for sqlalchemy, numpy and requests, all of which ship py.typed.
# Excluding the venvs is not enough; they must not be discovered as sources at
# all. Naming the roots also cuts a full run from minutes to seconds.
files                  = ["src", "tests", "scripts"]
warn_unused_configs    = true
warn_redundant_casts   = true
warn_unused_ignores    = true
no_implicit_optional   = true
ignore_missing_imports = false

# Deliberately lenient to start: Phase 4 adds signatures to the API and core
# modules and tightens these. Turning them on now would produce a wall of
# errors that says nothing about correctness.
check_untyped_defs     = false
disallow_untyped_defs  = false

# The dependencies that ship no type information. This list is exactly what
# mypy asks for and no more — sqlalchemy, numpy, requests, streamlit, mlflow,
# prophet, xgboost, lightgbm and transformers all resolve on their own, and
# listing them would be reported as an unused override.
#
# Stubs exist for several of these (pandas-stubs, scipy-stubs, types-psycopg2) and would be strictly better
# than suppressing. They are not pulled in here because this is a pandas-heavy
# codebase and adopting pandas-stubs surfaces a large new error set that wants
# its own pass rather than being bundled into a typing cleanup.
[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "feedparser.*",
    "newsapi.*",
    "pandas.*",
    "plotly.*",
    "psycopg2.*",
    "scipy.*",
    "statsmodels.*",
    "ta.*",
    "yfinance.*",
]
ignore_missing_imports = true


# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths          = ["tests"]
python_files       = ["test_*.py"]
addopts            = "-q --strict-markers"
markers = [
    "eval: end-to-end evaluation runs; slow, excluded from the default CI run",
    "integration: requires a live database or network; excluded from the default CI run",
]


# ── coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
branch = true
source = ["src/quantflow"]
omit   = [
    "venv-311/*",
    ".venv/*",
    "tests/*",
    "conftest.py",
    "scripts/*",
    "src/quantflow/dashboard/*",  # Streamlit UI: run, not unit tested
]

[tool.coverage.report]
show_missing   = true
skip_covered   = true
exclude_lines  = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
