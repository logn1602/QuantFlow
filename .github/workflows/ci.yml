name: CI

on:
  push:
    branches: [main, 'chore/**', 'refactor/**', 'fix/**', 'feat/**', 'docs/**']
  pull_request:
    branches: [main]

# Nothing here writes to the repo. gitleaks needs full history, granted per-job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # config.py reads these at import time, and every source module imports it.
  # Dummy values keep lint/typecheck/test hermetic: the offline suite never
  # opens a connection, but the module-level DATABASE_URL still has to build.
  DB_PASSWORD: ci-not-a-real-password
  TICKERS: AAPL,MSFT

# setup-uv steps here set prune-cache: true. v9 stopped pruning the cache
# before saving it, and uv.lock pins PyPI's torch with its CUDA libraries,
# so an unpruned cache could hold gigabytes of wheels that PyPI serves as
# fast, in the repository's 10 GB of Actions cache beside the FinBERT
# model. Pruned, it keeps only what was built from source. version pins uv
# itself, the same release in every workflow (daily_refresh.yml says why).
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          prune-cache: true
      # Version must match the ruff pin in .pre-commit-config.yaml and the
      # floor in pyproject.toml [dev]. Bump all three together.
      - name: ruff check
        run: uvx ruff@0.16.5 check --output-format=github .
      - name: ruff format --check
        run: uvx ruff@0.16.5 format --check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          prune-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dev dependencies
        run: uv sync --locked --extra dev
      - name: mypy
        run: uv run mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          prune-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dev dependencies
        run: uv sync --locked --extra dev
      # Excludes the eval and integration markers: those need a seeded database
      # and two years of price history, neither of which exists on a runner.
      - name: pytest
        run: uv run pytest -m "not eval and not integration" --cov --cov-report=term-missing

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
