name: QuantFlow Trending Tier

# The trending tier (docs/trending.md): the stocks people are watching and
# trading heavily right now, discovery and analytics only, in tables of its
# own. Never forecast, ensembled or backtested, and never in the evaluation.
#
# Its own workflow, started once the daily refresh has finished, whatever its
# result, never beside it: so it shares neither the refresh's 45-minute
# timeout nor its test step, and a red trending run never turns the refresh,
# which feeds the forward tests, red. It stops if GitHub ever disables the
# refresh's schedule (60 days without repository activity), since it starts
# from the refresh's completion.
on:
  workflow_run:
    workflows: ["QuantFlow Daily Data Refresh"]
    types: [completed]
    branches: [main]

  # Allow a manual run from the GitHub Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN is only used for the actions/checkout clone. Nothing here
# pushes, opens PRs, uploads or downloads artifacts, or calls the gh CLI.
permissions:
  contents: read

# One trending run at a time; a running one is never cancelled.
concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  trending:
    # By hand, or after a refresh this repository ran on its own schedule or
    # by hand: a workflow_run event names the triggering run's repository and
    # event, so a run set off from a fork's branch never gets here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The database's write credentials are not here but on the one step that
    # writes, so setup-uv, the caches and the test suite never hold them.
    env:
      # The core watchlist, which the tier leaves out of its lists (rule 3).
      # The same eight as daily_refresh.yml and .env.example.
      TICKERS: AAPL,MSFT,GOOGL,AMZN,NVDA,TSLA,META,JPM
      # Always tracked, outside the cap; the default in config.py and
      # .env.example too.
      TRENDING_PINNED: SPCX
      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes: the token is not left in .git/config.
          persist-credentials: false

      # prune-cache: v9 of setup-uv stopped pruning before saving; see ci.yml.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      # The exact versions in uv.lock, as CI and the daily refresh install
      # them.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # The whole offline suite, the trending tests included: the daily
      # refresh's test step leaves those out, so they run here before the tier
      # writes anything.
      - name: Run tests
        run: uv run pytest -m "not eval and not integration"
        env:
          # CI's dummy, for the URL config builds at import: the offline
          # suite opens no connection.
          DB_PASSWORD: ci-not-a-real-password

      # The model the daily refresh caches, by the revision the code pins
      # (FINBERT_REVISION in features/sentiment.py).
      - name: Cache the FinBERT model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: finbert-${{ runner.os }}-4556d13015211d73dccd3fdd39d39232506f3e43

      # Fetch the lists, choose the active set, then prices, analytics and
      # sentiment for it, sentiment last. Exits 1 when any list failed, after
      # storing what the others returned (T8), when a write or FinBERT
      # failed, when a step did nothing for any active symbol, or when the
      # tables are not there yet, so GitHub's failure notice goes out.
      #
      # It logs in as the tier's own role, quantflow_trending
      # (sql/schema_roles.sql, steps 11 to 14), not as the daily refresh's
      # postgres, which owns every table: the role can write the five
      # trending tables only, in the commands a run uses, and no core table.
      # The same database; TRENDING_DB_USER is quantflow_trending.<project-ref>
      # on Supabase's pooler, as DB_USER is postgres.<project-ref>.
      - name: Run the trending tier
        run: uv run python -m quantflow.pipelines.trending
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.TRENDING_DB_USER }}
          DB_PASSWORD: ${{ secrets.TRENDING_DB_PASSWORD }}
