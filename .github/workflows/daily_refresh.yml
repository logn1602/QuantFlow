name: QuantFlow Daily Data Refresh

on:
  # Run daily at 22:30 UTC (6:30 PM ET — after market close)
  schedule:
    - cron: '30 22 * * 1-5'   # Mon-Fri only (weekdays)

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

# GITHUB_TOKEN is only used for the actions/checkout clone. Nothing in this
# workflow pushes, opens PRs, uploads artifacts, or calls the gh CLI.
permissions:
  contents: read

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Shared by every step below. Previously each step re-declared these, so a
    # variable missed in one step became a silent breakage.
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      TICKERS: AAPL,MSFT,GOOGL,AMZN,NVDA,TSLA,META,JPM
      LOG_LEVEL: INFO

    steps:
      # NOTE: actions/checkout and actions/setup-python are intentionally left
      # on major-version tags rather than SHA-pinned. Both are GitHub
      # first-party actions; pinning them adds churn without meaningful risk
      # reduction here.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Runs before any data step so a logic regression fails fast, before
      # touching the database. The suite is offline by design — no secrets,
      # no DB, no network.
      - name: Run tests
        run: pytest -q

      - name: Fetch latest price data
        env:
          # yfinance needs no key. ALPHA_VANTAGE_API_KEY is kept here because
          # this is the ingestion step that would consume it if the Alpha
          # Vantage fetcher were enabled; no step reads it today.
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          python -c "from ingestion.yfinance_fetcher import fetch_intraday; fetch_intraday()"

      - name: Compute technical indicators
        run: python indicators.py

      - name: Detect anomalies
        run: python anomaly_detection.py

      - name: Analyze news sentiment
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python sentiment.py

      - name: Run all 5 forecasting models
        run: python run_models.py

      - name: Run strategy backtest
        run: python backtest.py

      - name: Summary
        run: |
          echo "QuantFlow daily refresh complete!"
          echo "Live dashboard: https://quantflow-analytics.streamlit.app"
