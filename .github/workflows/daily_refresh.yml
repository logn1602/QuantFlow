name: QuantFlow Daily Data Refresh

on:
  # Run daily at 22:30 UTC (6:30 PM ET, after market close)
  schedule:
    - cron: '30 22 * * 1-5'   # Mon-Fri only (weekdays)

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

# GITHUB_TOKEN is only used for the actions/checkout clone. Nothing in this
# workflow pushes, opens PRs, uploads artifacts, or calls the gh CLI.
permissions:
  contents: read

# One refresh at a time: a manual run started during the scheduled one would
# interleave its writes with it. A running refresh is never cancelled; the
# newer one waits for it.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Shared by every step below, and no secret among them. The database
    # login is postgres, which owns every table and which row-level security
    # does not apply to, so each step that connects names the five DB_*
    # secrets itself: setup-uv, the caches, the install (which builds ta from
    # its source) and the test suite never hold them, as in trending.yml.
    # tests/unit/test_workflows.py checks that every step that connects has
    # all five and that no other step has any, so none can be missed.
    env:
      TICKERS: AAPL,MSFT,GOOGL,AMZN,NVDA,TSLA,META,JPM
      LOG_LEVEL: INFO

    steps:
      # Every action is pinned to a commit, with its release in the comment
      # Dependabot reads (.github/dependabot.yml).
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # prune-cache: v9 of setup-uv stopped pruning before saving; see ci.yml.
      # version: uv itself, pinned as in every workflow, so a uv release
      # cannot change the install or `uv run` under the refresh. Dependabot
      # updates the action, not this; raise it by hand, in every workflow.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          prune-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      # The exact versions in uv.lock, as CI installs them: the evaluation ran
      # on these, and a different library version can give a different
      # forecast from the same data. requirements.txt is the same versions,
      # exported for pip (make requirements).
      # --locked stops here if uv.lock no longer matches pyproject.toml.
      # Installs the quantflow package itself too (editable), which the src/
      # layout needs. Every command below runs through `uv run`, in this
      # environment, not the runner's own Python. These versions are audited
      # for advisories in dependency_audit.yml, apart from this job, so a red
      # refresh always means a data problem.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Runs before any data step so a logic regression fails fast, before
      # touching the database. The suite is offline by design: no DB and no
      # network (tests/conftest.py refuses both), and it holds no secret: CI's
      # dummy password, for the URL config builds at import. CI's selection,
      # which leaves the eval and integration suites out, less the trending
      # tier's tests: they run in CI and in trending.yml, so a failing
      # trending test does not stop the core's data steps. A trending module
      # that cannot be imported still can, since pytest imports every module
      # it collects before deselecting (docs/architecture.md, Known problem 16).
      - name: Run tests
        id: tests
        env:
          DB_PASSWORD: ci-not-a-real-password
        run: uv run pytest -m "not eval and not integration and not trending"

      - name: Fetch latest 15-min bars
        id: fetch_intraday
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # yfinance needs no key. ALPHA_VANTAGE_API_KEY is kept here because
          # this is the ingestion step that would consume it if the Alpha
          # Vantage fetcher were enabled; no step reads it today.
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: uv run python -m quantflow.ingestion.yfinance_fetcher --intraday

      # The daily bar carries Yahoo's official close and full-day volume; the
      # loaders only build a day from 15-min bars where no daily bar exists.
      # 22:30 UTC is after 17:00 New York in both EST and EDT, so today's bar
      # is final by the time this runs. Five days heals any missed run.
      - name: Fetch daily bars
        id: fetch_daily
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: uv run python -m quantflow.ingestion.yfinance_fetcher --daily

      # Fails the refresh before any stage reads prices if stored closes no
      # longer match Yahoo's, which is what a stock split after the rows were
      # stored looks like, if a stored close moved by a split-sized amount in
      # one day (unless listed in config/split_jump_acknowledged.txt and
      # confirmed by Yahoo), or if any ticker could not be checked. Threshold:
      # SPLIT_GUARD_THRESHOLD, default 0.15.
      - name: Check stored prices against Yahoo (split guard)
        id: split_guard
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: uv run python -m quantflow.ingestion.split_guard

      - name: Compute technical indicators
        id: indicators
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: uv run python -m quantflow.features.indicators

      - name: Detect anomalies
        id: anomalies
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: uv run python -m quantflow.features.anomalies

      # FinBERT, about 440 MB, downloads from Hugging Face on first use. The key
      # is the revision the code pins (FINBERT_REVISION in
      # features/sentiment.py), so a new revision downloads once. actions/cache
      # saves only when the whole job succeeds. It runs when the news does.
      - name: Cache the FinBERT model
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: finbert-${{ runner.os }}-4556d13015211d73dccd3fdd39d39232506f3e43

      # Runs once the tests have passed, even when a data step before it
      # failed: Yahoo's RSS feeds show only current headlines, so a day not
      # fetched is lost for good, and the forward test of the news needs a
      # fetch every trading day (docs/evaluation.md, section 4). Exits 1 when
      # FinBERT cannot be loaded or when every RSS feed failed, which fails
      # the run. Reads Yahoo's RSS feeds only: NewsAPI's free plan is for
      # development and testing, so no key is passed.
      - name: Analyze news sentiment
        id: sentiment
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: uv run python -m quantflow.features.sentiment

      # Runs only when every data step before it succeeded, whatever the news
      # step did: a failed split guard still stops it, and a failed sentiment
      # step does not (the models train on the sentiment already stored, and
      # the run still shows as failed).
      - name: Run all 5 forecasting models
        id: models
        if: ${{ !cancelled() && steps.fetch_intraday.outcome == 'success' && steps.fetch_daily.outcome == 'success' && steps.split_guard.outcome == 'success' && steps.indicators.outcome == 'success' && steps.anomalies.outcome == 'success' }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: uv run python -m quantflow.pipelines.run_models

      - name: Run strategy backtest
        if: ${{ !cancelled() && steps.models.outcome == 'success' }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: uv run python -m quantflow.pipelines.backtest

      - name: Summary
        run: |
          echo "QuantFlow daily refresh complete!"
          echo "Live dashboard: https://quantflow-analytics.streamlit.app"
