# QuantFlow pre-commit hooks
#
# Install once:  uv run pre-commit install
# Run manually:  uv run pre-commit run --all-files
#
# Ruff and mypy are pinned to the same versions as the [dev] extra in
# pyproject.toml. When you bump one, bump the other — a drift between them
# means CI and your local commit disagree about what is an error.

default_language_version:
  python: python3.11

repos:
  # ── Hygiene ─────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'          # trailing double-space is a hard break in Markdown
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']     # mlflow.db reached 1.2 MB before it was untracked
        exclude: '^uv\.lock$'    # a lockfile is legitimately large, and it is text
      - id: mixed-line-ending
        args: ['--fix=lf']

  # ── Lint + format ───────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ── Types ───────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # Config lives in pyproject.toml. Third-party stubs are handled by the
        # overrides there, so the hook does not install the full dependency set.
        args: [--config-file=pyproject.toml]
        additional_dependencies: []
        exclude: '^(venv-311|mlruns|mlruns_artifacts|logs)/'

  # ── Secrets ─────────────────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
